name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -o TopazAIMobile_source.zip -d project

      - name: Fix Java and Kotlin targets
        run: |
          cat > jvm-fix.gradle <<'EOF'
          allprojects {
            tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = '17'
              targetCompatibility = '17'
            }
            tasks.configureEach {
              if (name.toLowerCase().contains('kotlin')) {
                try {
                  kotlinOptions.jvmTarget = '17'
                } catch (Exception ignored) {
                }
              }
            }
          }
          EOF

      - name: Build APK
        working-directory: project
        run: gradle -I ../jvm-fix.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TopazAI-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
