name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        run: unzip -o TopazAIMobile_source.zip -d project

      - name: Fix JVM targets
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' project/app/build.gradle.kts
          sed -i 's/JVM_1_8/JVM_17/g' project/app/build.gradle.kts
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' project/app/build.gradle.kts

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TopazAI-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
